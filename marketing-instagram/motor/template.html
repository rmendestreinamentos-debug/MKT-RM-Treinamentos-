<!doctype html>
<meta charset="utf-8">
<!-- Montserrat via Google Fonts (pesos 400/700/800/900) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap">
<link rel="stylesheet" href="../marca/tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  /* dimensão real de publicação */
  .slide{width:1080px;height:1350px;position:relative;display:flex;flex-direction:column;
    font-family:var(--corpo);overflow:hidden}
  .slide.claro{background:var(--papel);color:var(--tinta)}
  .slide.escuro{background:var(--tinta);color:var(--papel)}

  /* Foto de fundo + véu escuro: o texto SEMPRE tem que ganhar da imagem.
     A foto vem do banco do dono — não dá pra confiar que ela seja escura onde o
     texto cai. Por isso o véu é forte por padrão; a peça abre com "veu":"leve"
     quando a imagem for escura o bastante pra aparecer mais. */
  /* O corte 4:5 sempre come parte da foto. `foco` escolhe O QUE fica: num retrato,
     "topo" salva o rosto — senão o corte centraliza no tronco e decapita a pessoa. */
  .foto{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
  .foto.topo{background-position:center top}
  .foto.baixo{background-position:center bottom}
  .foto.esquerda{background-position:left center}
  .foto.direita{background-position:right center}
  .veu{position:absolute;inset:0;z-index:1}
  .veu.medio{background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.80) 50%, rgba(0,0,0,.97) 100%)}
  .veu.leve {background:linear-gradient(180deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,.62) 52%, rgba(0,0,0,.92) 100%)}
  .veu.forte{background:linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.88) 50%, rgba(0,0,0,.99) 100%)}

  /* Brilho radial no acento — o que nas referências é verde, aqui é dourado. */
  .slide.impacto.escuro::before{content:"";position:absolute;inset:0;z-index:1;
    background:radial-gradient(115% 65% at 50% 28%, rgba(244,182,97,.20), transparent 62%)}

  .slide > *:not(.foto):not(.veu){position:relative;z-index:2}

  /* ---------- selo da marca (topo no padrão, rodapé nos tipos de impacto) ---------- */
  .selo{display:flex;align-items:center;gap:22px}
  .selo.topo{padding:70px 90px 0}
  .selo.rodape{margin-top:auto;justify-content:center;padding:0 90px 74px}
  .selo .logo{width:74px;height:74px;border-radius:18px;background:var(--acento);
    display:grid;place-items:center;font-weight:800;color:var(--tinta);font-size:40px}
  /* logo por extenso (wordmark): lockup num chip preto.
     Slide escuro: o chip funde no fundo. Slide claro: vira barra preta arredondada. */
  .selo .logo-lockup{height:96px;width:auto;max-width:620px;object-fit:contain;display:block;
    background:var(--tinta);border-radius:16px;padding:18px 26px}
  .selo.rodape .logo-lockup{height:84px}
  .selo .nome{font-size:34px;font-weight:700}
  .slide.escuro .selo .nome{color:var(--papel)}

  /* ---------- corpo ---------- */
  .corpo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:90px}
  .corpo.centro{align-items:center;text-align:center}

  /* a palavra-chave em outra cor, dentro da mesma frase — o `*asterisco*` do conteúdo */
  .destaque{color:var(--acento)}
  .slide.claro .destaque{color:var(--apoio)}

  .eyebrow{font-size:32px;letter-spacing:.14em;text-transform:uppercase;color:var(--apoio);font-weight:700;margin-bottom:34px}
  .slide.escuro .eyebrow{color:var(--acento)}
  .titulo{font-family:var(--display);font-weight:700;line-height:1.04}
  .texto{margin-top:40px;font-size:42px;color:var(--suave);line-height:1.5;max-width:850px}
  .slide.escuro .texto{color:#c4c1b4}

  /* ---------- tipo: contagem regressiva ---------- */
  .prefixo{font-family:var(--display);font-weight:800;text-transform:uppercase;
    letter-spacing:.16em;font-size:46px;margin-bottom:6px}
  .numerao{font-family:var(--display);font-weight:900;text-transform:uppercase;
    line-height:.92;letter-spacing:-.01em}
  .numerao .num{color:var(--acento)}
  .apoio{margin-top:44px;font-size:44px;line-height:1.4;max-width:820px;font-weight:700;text-wrap:balance}
  .data{margin-top:30px;font-size:36px;font-weight:700;color:var(--suave);
    letter-spacing:.08em;text-transform:uppercase}
  .slide.escuro .data{color:#b0ad9f}

  /* ---------- tipo: depoimento ---------- */
  .aspas{font-family:var(--display);font-weight:900;font-size:220px;line-height:.6;
    color:var(--acento);opacity:.28;display:block;margin-bottom:20px}
  .citacao{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:1.06;text-wrap:balance}
  .autoria{margin-top:52px}
  .autoria .autor{font-size:38px;font-weight:800}
  .autoria .cargo{font-size:38px;font-weight:400;color:var(--suave);margin-left:10px}
  .slide.escuro .autoria .cargo{color:#c4c1b4}
  .autoria .obs-autor{display:block;margin-top:12px;font-size:32px;color:var(--suave)}
  .slide.escuro .autoria .obs-autor{color:#9d9a8f}

  /* ---------- tipos: provocação e urgência ---------- */
  .impacto-txt{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:1.08;
    text-wrap:balance}

  /* ---------- CTA ---------- */
  .cta{padding:0 90px 40px}
  .slide.padrao .cta{padding-bottom:90px}   /* sem selo no rodapé, o CTA fecha a peça */
  /* nos tipos de impacto o CTA anda junto do texto — texto e chamada são um bloco só */
  .corpo .cta{padding:0;margin-top:64px;text-align:center}
  .cta .pill{display:inline-flex;background:var(--acento);color:var(--tinta);
    font-weight:800;font-size:40px;padding:26px 44px;border-radius:999px}
  .cta.link .pill{background:var(--apoio);color:var(--tinta)}
  /* CTA orgânico não é botão: é chamada sublinhada, como nas referências */
  .cta.organico .pill{background:none;color:var(--papel);padding:0;
    text-decoration:underline;text-underline-offset:10px;font-weight:700}
  .slide.claro .cta.organico .pill{color:var(--tinta)}
  .cta .obs{display:block;font-size:32px;color:var(--suave);margin-top:26px}
  .slide.escuro .cta .obs{color:#b0ad9f}

  .paginador{position:absolute;top:70px;right:90px;font-size:32px;font-weight:700;color:var(--suave)}
  .slide.escuro .paginador{color:#b0ad9f}

  /* ============================================================
     CARROSSEL NATIVO — thread e legenda.
     Aqui a identidade da casa NÃO entra: sem logo, sem dourado, sem Montserrat.
     A peça imita conteúdo orgânico; carimbar marca mataria o efeito.
     ============================================================ */
  .slide.nativo{font-family:var(--nativo)}
  .slide.nativo.claro{background:#fff;color:#0f1419}
  .slide.nativo.escuro{background:#000;color:#e7e9ea}
  .slide.nativo .corpo{padding:0;justify-content:flex-start}
  .slide.nativo.escuro .corpo{justify-content:center}   /* slide de remate: texto centrado */

  /* ---------- thread do X ---------- */
  .slide.thread{padding:64px}
  .perfil{display:flex;align-items:center;gap:24px;margin-bottom:48px}
  .perfil .avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;flex:none}
  .perfil .avatar.vazio{display:grid;place-items:center;background:#cfd9de;color:#5b7083;
    font-weight:700;font-size:44px}
  .perfil .quem{display:flex;flex-direction:column;gap:2px;min-width:0}
  .perfil .nome-perfil{display:flex;align-items:center;gap:10px;font-size:42px;font-weight:700}
  .perfil .verificado{width:40px;height:40px;flex:none}
  .perfil .handle{font-size:38px;color:#71767b}

  .thread-txt{font-weight:700;line-height:1.32;letter-spacing:-.01em}
  .thread-txt .tp + .tp{margin-top:1.1em}
  /* marca-texto: na thread o realce é caixa vermelha, não o dourado da casa */
  .slide.thread .destaque{background:var(--marcador);color:#fff;padding:2px 10px;border-radius:6px;
    -webkit-box-decoration-break:clone;box-decoration-break:clone}

  .thread-capa{text-align:center;margin-top:40px}
  .thread-titulo{font-size:76px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em}
  .thread-gancho{margin-top:56px;font-size:64px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  .thread-img{display:block;width:100%;margin-top:52px;border-radius:32px;object-fit:cover;
    max-height:640px;flex:none}

  /* ---------- foto com caixa de legenda ---------- */
  .slide.legenda{padding:0}
  .slide.legenda .corpo{flex:1;padding:0;justify-content:center}
  .paineis{display:flex;width:100%;height:100%;gap:4px;background:#000}
  .painel{flex:1;min-width:0;position:relative;background-size:cover;background-position:center;
    background-color:#111;display:flex;align-items:flex-end;justify-content:center;padding-bottom:22%}
  .painel .caixa{background:#fff;color:#000;font-weight:700;font-size:44px;line-height:1.22;
    text-align:center;padding:24px 30px;max-width:86%}
  .paineis .painel:only-child .caixa{font-size:56px;max-width:70%}

  /* fecho do carrossel: fundo branco, só a pergunta e o CTA de comentário */
  .legenda-fecho{font-weight:700;line-height:1.3;letter-spacing:-.02em;padding:90px}
  .legenda-fecho .lf + .lf{margin-top:1.2em}
</style>
<div id="slide"></div>
