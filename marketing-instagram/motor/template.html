<!doctype html>
<meta charset="utf-8">
<!-- Montserrat via Google Fonts (pesos 400/700/800/900) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap">
<link rel="stylesheet" href="../marca/tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  /* dimensão real de publicação */
  .slide{width:1080px;height:1350px;position:relative;display:flex;flex-direction:column;
    font-family:var(--corpo);overflow:hidden}
  .slide.claro{background:var(--papel);color:var(--tinta)}
  .slide.escuro{background:var(--tinta);color:var(--papel)}

  /* Foto de fundo + véu escuro: o texto SEMPRE tem que ganhar da imagem.
     A foto vem do banco do dono — não dá pra confiar que ela seja escura onde o
     texto cai. Por isso o véu é forte por padrão; a peça abre com "veu":"leve"
     quando a imagem for escura o bastante pra aparecer mais. */
  /* O corte 4:5 sempre come parte da foto. `foco` escolhe O QUE fica: num retrato,
     "topo" salva o rosto — senão o corte centraliza no tronco e decapita a pessoa. */
  .foto{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
  .foto.topo{background-position:center top}
  .foto.baixo{background-position:center bottom}
  .foto.esquerda{background-position:left center}
  .foto.direita{background-position:right center}
  .veu{position:absolute;inset:0;z-index:1}
  .veu.medio{background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.80) 50%, rgba(0,0,0,.97) 100%)}
  .veu.leve {background:linear-gradient(180deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,.62) 52%, rgba(0,0,0,.92) 100%)}
  .veu.forte{background:linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.88) 50%, rgba(0,0,0,.99) 100%)}

  /* Brilho radial no acento — o que nas referências é verde, aqui é dourado. */
  .slide.impacto.escuro::before{content:"";position:absolute;inset:0;z-index:1;
    background:radial-gradient(115% 65% at 50% 28%, rgba(244,182,97,.20), transparent 62%)}

  /* Conteúdo acima da foto e do véu. O paginador fica de fora: ele é absolute
     (canto superior), e esta regra o forçaria a relative, jogando-o pra fora do canto. */
  .slide > *:not(.foto):not(.veu):not(.paginador){position:relative;z-index:2}

  /* ---------- selo da marca (topo no padrão, rodapé nos tipos de impacto) ---------- */
  .selo{display:flex;align-items:center;gap:22px}
  .selo.topo{padding:70px 90px 0}
  .selo.rodape{margin-top:auto;justify-content:center;padding:0 90px 74px}
  .selo .logo{width:74px;height:74px;border-radius:18px;background:var(--acento);
    display:grid;place-items:center;font-weight:800;color:var(--tinta);font-size:40px}
  /* logo por extenso (wordmark): lockup num chip preto.
     Slide escuro: o chip funde no fundo. Slide claro: vira barra preta arredondada. */
  .selo .logo-lockup{height:96px;width:auto;max-width:620px;object-fit:contain;display:block;
    background:var(--tinta);border-radius:16px;padding:18px 26px}
  .selo.rodape .logo-lockup{height:84px}
  .selo .nome{font-size:34px;font-weight:700}
  .slide.escuro .selo .nome{color:var(--papel)}

  /* ---------- corpo ---------- */
  .corpo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:90px}
  .corpo.centro{align-items:center;text-align:center}

  /* a palavra-chave em outra cor, dentro da mesma frase — o `*asterisco*` do conteúdo */
  .destaque{color:var(--acento)}
  .destaque.junto{white-space:nowrap}   /* realce curto não racha entre linhas */
  .slide.claro .destaque{color:var(--apoio)}

  .eyebrow{font-size:32px;letter-spacing:.14em;text-transform:uppercase;color:var(--apoio);font-weight:700;margin-bottom:34px}
  .slide.escuro .eyebrow{color:var(--acento)}
  .titulo{font-family:var(--display);font-weight:700;line-height:1.04}
  .texto{margin-top:40px;font-size:42px;color:var(--suave);line-height:1.5;max-width:850px}
  .slide.escuro .texto{color:#c4c1b4}

  /* ---------- tipo: contagem regressiva ---------- */
  .prefixo{font-family:var(--display);font-weight:800;text-transform:uppercase;
    letter-spacing:.16em;font-size:46px;margin-bottom:6px}
  .numerao{font-family:var(--display);font-weight:900;text-transform:uppercase;
    line-height:.92;letter-spacing:-.01em}
  .numerao .num{color:var(--acento)}
  .apoio{margin-top:44px;font-size:44px;line-height:1.4;max-width:820px;font-weight:700;text-wrap:balance}
  .data{margin-top:30px;font-size:36px;font-weight:700;color:var(--suave);
    letter-spacing:.08em;text-transform:uppercase}
  .slide.escuro .data{color:#b0ad9f}

  /* ---------- tipo: depoimento ---------- */
  .aspas{font-family:var(--display);font-weight:900;font-size:220px;line-height:.6;
    color:var(--acento);opacity:.28;display:block;margin-bottom:20px}
  .citacao{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:1.06;text-wrap:balance}
  /* citação longa: sentence case e entrelinha maior — caixa alta viraria paredão */
  .citacao.longa{text-transform:none;font-weight:700;line-height:1.28;letter-spacing:-.01em}
  .autoria{margin-top:52px}
  .autoria .autor{font-size:38px;font-weight:800}
  .autoria .cargo{font-size:38px;font-weight:400;color:var(--suave);margin-left:10px}
  .slide.escuro .autoria .cargo{color:#c4c1b4}
  .autoria .obs-autor{display:block;margin-top:12px;font-size:32px;color:var(--suave)}
  .slide.escuro .autoria .obs-autor{color:#9d9a8f}

  /* ---------- tipo: urgência ---------- */
  .impacto-txt{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:1.08;
    text-wrap:balance}

  /* ---------- tipo: provocação ----------
     O modelo empilha: número em display gigante, texto de ligação pequeno entre
     eles. O contraste de TAMANHO é o que para o scroll — não a cor. */
  .provoca{display:flex;flex-direction:column;align-items:center;text-align:center}
  .provoca-num{font-family:var(--display);font-weight:900;text-transform:uppercase;
    line-height:.94;letter-spacing:-.02em;color:var(--acento);white-space:nowrap}
  .provoca-liga{font-family:var(--display);font-weight:800;text-transform:uppercase;
    line-height:1.14;letter-spacing:.01em;max-width:900px;text-wrap:balance;margin:14px 0}
  .slide.claro .provoca-num{color:var(--apoio)}

  /* ---------- tipo: carrossel de leitura ----------
     Texto longo pede LEITURA, não impacto: sentence case, corpo médio, alinhado
     à esquerda. Caixa alta gigante num parágrafo vira bloco grotesco e ninguém lê. */
  .slide.carrossel .corpo{align-items:flex-start;text-align:left;padding:100px 90px}
  .slide.carrossel .corpo .cta{text-align:left;margin-top:56px}
  .lead{font-family:var(--display);font-weight:800;line-height:1.2;letter-spacing:-.01em;
    text-wrap:balance;margin-bottom:38px}
  p.leitura{font-size:40px;line-height:1.46;color:#d6d3ca;font-weight:500;max-width:880px}
  p.leitura + p.leitura{margin-top:30px}
  .slide.carrossel .paginador{color:var(--acento)}

  /* ---------- CTA ---------- */
  .cta{padding:0 90px 40px}
  .slide.padrao .cta{padding-bottom:90px}   /* sem selo no rodapé, o CTA fecha a peça */
  /* nos tipos de impacto o CTA anda junto do texto — texto e chamada são um bloco só */
  .corpo .cta{padding:0;margin-top:64px;text-align:center}
  .cta .pill{display:inline-flex;background:var(--acento);color:var(--tinta);
    font-weight:800;font-size:40px;padding:26px 44px;border-radius:999px}
  .cta.link .pill{background:var(--apoio);color:var(--tinta)}
  /* CTA orgânico não é botão: é chamada sublinhada, como nas referências */
  .cta.organico .pill{background:none;color:var(--papel);padding:0;
    text-decoration:underline;text-underline-offset:10px;font-weight:700}
  .slide.claro .cta.organico .pill{color:var(--tinta)}
  /* marca d'água: a frase é a peça. Data e CTA assinam baixinho, sem roubar a cena. */
  .cta.marcadagua{margin-top:22px}
  .cta.marcadagua .pill{background:none;padding:0;color:var(--papel);opacity:.42;
    font-weight:700;font-size:30px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none}
  .slide.claro .cta.marcadagua .pill{color:var(--tinta)}
  .data.marcadagua{margin-top:60px;color:var(--papel);opacity:.34;font-size:28px;
    letter-spacing:.2em;font-weight:700;text-transform:uppercase}
  .slide.claro .data.marcadagua{color:var(--tinta)}

  .cta .obs{display:block;font-size:32px;color:var(--suave);margin-top:26px}
  .slide.escuro .cta .obs{color:#b0ad9f}

  .paginador{position:absolute;top:70px;right:90px;z-index:3;font-size:32px;font-weight:700;color:var(--suave)}
  .slide.escuro .paginador{color:#b0ad9f}

  /* ============================================================
     TRÁFEGO PAGO — anuncio e caricato.
     Estes dois não são "peça com CTA de link": são ANÚNCIO. A diferença é que o
     anúncio fecha o próprio rodapé (foto, logo, botão, ressalva, nessa ordem) —
     por isso o corpo monta tudo, em vez de herdar a montagem genérica.
     ============================================================ */

  /* ---------- tipo: anúncio de captação ----------
     A estrutura é um funil dentro da peça: promessa -> filtro -> prova -> botão.
     O CHIP é o que faz o formato funcionar — ele desqualifica quem não é o cliente
     ANTES do clique, e é por isso que o lead chega barato. Não é enfeite. */
  .slide.anuncio.escuro::before{content:"";position:absolute;inset:0;z-index:1;
    background:radial-gradient(115% 60% at 50% 24%, rgba(244,182,97,.22), transparent 62%)}

  /* No anúncio o selo cai SOBRE a foto, e ali o chip preto do lockup vira um
     retângulo sem pé nem cabeça — no resto do projeto ele funciona porque funde
     no fundo escuro. Aqui o logo assina solto, e quem garante a leitura sobre a
     imagem é a sombra, não uma caixa. */
  .slide.anuncio .selo .logo-lockup,
  .slide.caricato .selo .logo-lockup{background:none;padding:0;border-radius:0;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.9)) drop-shadow(0 10px 34px rgba(0,0,0,.7))}
  .slide.anuncio .corpo{padding:0;justify-content:flex-start;align-items:center;text-align:center}
  .anuncio-topo{display:flex;flex-direction:column;align-items:center;width:100%;padding:96px 60px 0}
  /* o eyebrow do anúncio é uma CÁPSULA, não uma linha solta: ela dá o ar de rótulo */
  .slide.anuncio .eyebrow{border:2px solid var(--acento);border-radius:999px;
    padding:14px 40px;font-size:27px;letter-spacing:.2em;margin-bottom:38px}
  .anuncio-titulo{font-family:var(--display);font-weight:800;line-height:1.06;
    letter-spacing:-.02em;max-width:1000px}
  .anuncio-sub{margin-top:30px;font-size:37px;font-weight:500;line-height:1.4;
    color:#d6d3ca;max-width:900px;text-wrap:balance}
  .anuncio-sub .destaque{font-weight:800}

  /* chip: retângulo chanfrado. O contorno dourado é o pai; o miolo preto é o filho.
     (borda + clip-path não convivem — o clip corta a borda nas diagonais.) */
  .chips{display:flex;gap:24px;justify-content:center;width:100%;margin-top:46px}
  .chip{flex:1;background:var(--acento);padding:3px;
    clip-path:polygon(30px 0,100% 0,100% calc(100% - 30px),calc(100% - 30px) 100%,0 100%,0 30px)}
  .chip-in{display:flex;align-items:center;gap:20px;height:100%;padding:22px 26px;background:#0a0a0a;
    clip-path:polygon(28px 0,100% 0,100% calc(100% - 28px),calc(100% - 28px) 100%,0 100%,0 28px)}
  .chip-ico{flex:none;width:72px;height:72px;display:grid;place-items:center;color:var(--acento);
    background:rgba(244,182,97,.13);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
  .chip-ico svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .chip-txt{display:flex;flex-direction:column;gap:2px;text-align:left;line-height:1.18;min-width:0}
  .chip-txt .l1{font-size:26px;font-weight:500;color:#e8e5dc}
  /* o número do filtro NÃO racha em duas linhas: "R$ 100" numa linha e "mil/mês" na
     outra desmonta o critério justamente onde ele precisa ser lido de relance. */
  .chip-txt .l2{font-size:32px;font-weight:800;color:var(--acento);white-space:nowrap}

  /* O palco: a foto entra como FAIXA embaixo (o acervo não tem recorte, então ela
     desvanece no preto em cima em vez de fingir um cutout). Logo, botão e ressalva
     ficam por cima dela — é a ordem do modelo. */
  .anuncio-palco{position:relative;flex:1;min-height:0;width:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;padding:0 60px 70px}
  /* A foto EMERGE do fundo por MÁSCARA — ela não é um retângulo tapado com preto.
     Tapar com preto cria uma emenda reta e visível: acima da faixa existe o brilho
     dourado do slide, e o preto do véu o apaga de um pixel pro outro. Com máscara
     nada cobre o brilho — a foto só vai ganhando opacidade dentro dele. */
  .anuncio-palco > .foto{
    -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 22%);
            mask-image:linear-gradient(180deg, transparent 0%, #000 22%)}
  /* Ao véu sobra só o trabalho de baixo: segurar o botão sobre a imagem. O miolo
     fica limpo — a foto é a prova de que o evento existe; se ela some, some a prova. */
  .anuncio-veu{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,
    transparent 0%, transparent 44%, rgba(0,0,0,.5) 70%, rgba(0,0,0,.93) 100%)}
  .anuncio-palco > .selo,.anuncio-palco > .botao,.anuncio-palco > .ressalva{position:relative;z-index:2}
  .selo.anuncio{justify-content:center;margin-bottom:44px}
  /* O botão é o clique. Ele brilha porque no feed ele compete com vídeo, não com texto. */
  .botao{display:block;width:100%;max-width:900px;text-align:center;
    font-family:var(--display);font-weight:900;font-size:52px;text-transform:uppercase;
    color:var(--tinta);background:linear-gradient(180deg,#f7c987,var(--acento) 55%,#d99a3f);
    padding:38px 30px;border-radius:20px;
    box-shadow:0 0 56px rgba(244,182,97,.55), 0 0 130px rgba(244,182,97,.22)}
  /* a ressalva não vende: ela QUALIFICA. Some se a peça não precisar dela. */
  .ressalva{margin-top:28px;font-size:29px;font-weight:500;color:#b0ad9f;text-align:center}

  /* ---------- tipo: caricato ----------
     Aqui a IMAGEM é a peça: sangra na arte inteira, o texto só remata embaixo.
     Sem selo de propósito — num anúncio quem assina é o @ da conta, não a arte. */
  .slide.caricato .corpo{padding:0;justify-content:flex-end;align-items:stretch;text-align:left}
  .caricato-img{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center}
  /* Véu forte embaixo: a imagem aqui é escolha avulsa do dono e pode ter TEXTO dentro
     (telão, print, cartaz). Texto de fundo competindo com o remate é o pior defeito
     desta peça — o leitor lê os dois e não lê nenhum. */
  .caricato-veu{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,
    transparent 30%, rgba(0,0,0,.45) 52%, rgba(0,0,0,.85) 70%, rgba(0,0,0,.97) 86%, #000 100%)}
  .slide.caricato .caricato-txt,.slide.caricato .caricato-cta,
  .slide.caricato .selo{position:relative;z-index:2}
  /* O selo assina no alto, ENCOSTADO NA ESQUERDA — não centralizado. Retrato põe a
     cabeça no meio do quadro, e selo centralizado cai em cima do cabelo. O canto é o
     único lugar que sobra livre em qualquer foto. `margin-bottom:auto` empurra o
     resto pro rodapé. */
  .selo.caricato{justify-content:flex-start;padding:52px 60px 0;margin-bottom:auto}
  .caricato-txt{padding:0 66px}
  /* A linha de apoio é o SETUP da piada — ela só funciona lida de uma vez. Se rachar
     em duas e deixar uma palavra órfã, o remate embaixo perde o tempo cômico. */
  .caricato-apoio{font-weight:500;line-height:1.2;color:#fff;margin-bottom:8px}
  .caricato-titulo{font-family:var(--display);font-weight:900;line-height:1.02;
    letter-spacing:-.025em;color:#fff;text-wrap:balance}
  /* A chamada imita o "Saiba Mais" nativo do Instagram — é o que faz o dedo ir pro
     botão de verdade, logo abaixo dela. Por isso é discreta: ela aponta, não grita. */
  .caricato-cta{display:flex;align-items:center;justify-content:center;gap:20px;
    margin-top:46px;padding:32px 60px 44px;background:rgba(0,0,0,.55)}
  .caricato-cta .badge{flex:none;width:62px;height:62px;display:grid;place-items:center;
    border-radius:16px;background:rgba(255,255,255,.14);color:#fff}
  .caricato-cta .badge svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  /* A chamada é UMA linha. Quebrada em duas ela deixa de parecer a legenda nativa
     do Instagram e passa a parecer texto de arte — que é justo o que ela imita. */
  .caricato-cta .chamada{font-weight:500;color:#e8e5dc;white-space:nowrap}
  .caricato-cta .destaque{color:#fff;font-weight:800}

  /* ---------- tipo: line-up de palestrantes ----------
     É uma COLAGEM, não uma grade: os palestrantes se encostam ombro a ombro, como no
     KV do evento. O ativo da peça são os NOMES confirmados — o rosto só dá cara a eles.

     Isso EXIGE recorte. Foto crua traria o retângulo do fundo junto e a colagem
     morreria ali. Os PNGs saem de `motor/tirar-fundo.js` para `palestrantes/recorte/`,
     já cortados no contorno da silhueta — é o corte no contorno que permite alinhar as
     cabeças, porque o "ar" que sobra em volta de cada foto é invisível e não se acerta
     no CSS. */
  /* A ORDEM DA PEÇA É A ORDEM DA VENDA, e ela vem do modelo: lockup (de quem é isto) →
     ROSTOS (por que você deveria se importar) → chamada → título → quando → botão.
     O rosto vem ANTES do texto de propósito: no feed, o que para o dedo é a fileira de
     gente conhecida, não a frase. A frase é o que ele lê depois de já ter parado. */
  .slide.palestrantes.escuro::before{content:"";position:absolute;inset:0;z-index:1;
    background:radial-gradient(120% 60% at 50% 34%, rgba(244,182,97,.20), transparent 62%)}
  .slide.palestrantes .corpo{padding:0;justify-content:flex-start;align-items:center;text-align:center}

  /* O fundo é CENÁRIO, não assunto: entra desfocado e dessaturado, senão a plateia
     compete com os cinco rostos que a peça veio mostrar. O `scale` existe porque o
     blur borra a borda — sem ele, apareceria uma moldura clara em volta. */
  .pal-fundo{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;
    filter:blur(7px) saturate(.5) brightness(.9);transform:scale(1.08)}
  /* O véu deixa o cenário aparecer só ATRÁS DOS ROSTOS, e fecha tudo em volta. No modelo
     o fundo é quase chapado: a plateia existe pra dar profundidade e temperatura ao ar
     entre as pessoas, não pra ser vista. Embaixo ele fecha de vez — ali mora o texto,
     e texto sobre plateia não se lê. */
  .pal-fundoveu{position:absolute;inset:0;z-index:1;background:
    radial-gradient(ellipse 80% 44% at 50% 34%, rgba(0,0,0,.10), rgba(0,0,0,.80) 100%),
    linear-gradient(180deg, rgba(0,0,0,.86) 0%, rgba(0,0,0,.52) 16%, rgba(0,0,0,.50) 44%, rgba(0,0,0,.93) 62%, rgba(0,0,0,.99) 74%)}
  .slide.palestrantes .pal-marca,.slide.palestrantes .pal-palco,
  .slide.palestrantes .pal-baixo{position:relative;z-index:2}

  /* O LOCKUP EM PÍLULA. No modelo a pílula é clara porque as marcas dele são escuras;
     a nossa é dourada, e sobre claro ela sumiria. Então copia-se a FORMA (o chip que
     isola a assinatura do resto da arte) e não a cor: vidro escuro, fio dourado. */
  .pal-marca{display:flex;justify-content:center;width:100%;padding:44px 56px 0}
  .selo.palestrantes{justify-content:center;padding:16px 44px;border-radius:999px;
    background:rgba(255,255,255,.06);border:1px solid rgba(244,182,97,.28);
    box-shadow:0 8px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07)}
  .slide.palestrantes .selo .logo-lockup{background:none;padding:0;border-radius:0;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.7))}

  /* O PALCO ocupa a folga entre o lockup e o bloco de venda, e o grupo se posiciona
     DENTRO dele por coordenada (o motor calcula o x de cada um em px). Não é mais um
     `flex` com margem negativa: o NOME precisa se alinhar ao dono, e pra isso os dois
     têm que sair da mesma conta. `overflow:hidden` deixa quem está na ponta sangrar na
     borda em vez de encolher o grupo inteiro pra caber. */
  /* O palco ABRAÇA o grupo — a altura vem do motor por `style`, não do flex. Esticando
     (`flex:1`), a fileira era jogada pro chão da arte e toda a sobra da peça virava um vão
     morto entre o logo e as cabeças.
     `margin-top:auto` junta a sobra INTEIRA acima da fileira, em vez de reparti-la em volta:
     o ar fica em cima das cabeças (como no modelo) e a chamada entra colada no nome — que é
     onde ela tem que estar, porque é o nome que ela vem explicar. */
  .pal-palco{position:relative;width:100%;flex:none;margin-top:auto;overflow:hidden}
  .pal-grupo{position:absolute;inset:0}

  /* A sombra vive no CHÃO, não em cada pessoa. Sombra por figura parece boa isolada e
     é um desastre na colagem: quem está na frente projeta a própria sombra no ROSTO de
     quem está atrás, e o resultado é uma mancha escura na cara das pessoas. */
  .pal-chao{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:0;
    width:88%;height:130px;pointer-events:none;
    background:radial-gradient(ellipse 50% 50% at 50% 100%, rgba(0,0,0,.6), transparent 70%)}
  .pal-vulto{position:absolute;transform:translateX(-50%)}
  /* A base DISSOLVE no fundo. Dois motivos, os dois práticos: os recortes vêm de fotos
     com enquadramentos diferentes (um corta na cintura, outro na coxa), e uma fileira
     de troncos decepados em alturas aleatórias fica horrível; e é justamente na barra
     da roupa que o recorte automático deixa os piores furos. Dissolver resolve os dois
     e ainda assenta o grupo no fundo em vez de colá-lo por cima.
     A dissolução começa CEDO porque é nessa faixa que o nome pousa: o nome precisa cair
     num tecido já escurecido, senão ele briga com a estampa da camisa. */
  /* Sem `drop-shadow` aqui, e não é esquecimento: a sombra da silhueta se espalha pros
     lados e, com os corpos encavalados, ela cai na cara de quem está atrás. O que separa
     as figuras é o contraste e o contorno escuro do próprio recorte. */
  .pal-vulto img{display:block;width:auto;
    -webkit-mask-image:linear-gradient(180deg, #000 68%, rgba(0,0,0,.55) 86%, transparent 100%);
            mask-image:linear-gradient(180deg, #000 68%, rgba(0,0,0,.55) 86%, transparent 100%);
    filter:contrast(1.06) saturate(.94)}

  /* PERSPECTIVA ATMOSFÉRICA — o que separa um grupo COMPOSTO de um grupo COLADO.
     As cinco fotos foram tiradas em cinco lugares, com cinco luzes; empilhá-las cruas dá
     cinco pessoas nítidas e igualmente iluminadas ocupando o mesmo plano, e o olho lê
     isso como recorte sobre fundo. Ar tem densidade: quem está atrás chega mais escuro,
     menos contrastado, menos saturado e um tico fora de foco. O plano sai do z-index —
     a ordem de profundidade que a peça já declara.
     Dose com a mão leve. O recuo tem um teto rígido: TODO palestrante precisa continuar
     RECONHECÍVEL — o nome dele é o que a peça vende, e nome sem rosto não vende nada. */
  .pal-vulto.plano-meio img{filter:contrast(1.02) saturate(.92) brightness(.93)}
  .pal-vulto.plano-fundo img{filter:contrast(1.0) saturate(.86) brightness(.85) blur(.5px)}

  /* A CAMADA DE ACABAMENTO passa por cima de TODO MUNDO — é ela que dá a todos a mesma
     luz. Um brilho quente vindo do alto, e o pé afundando no escuro: como o véu é único,
     ele iguala as cinco temperaturas de cor. Fica abaixo dos nomes (z 40): o nome não
     se apaga. */
  .pal-grade{position:absolute;inset:0;z-index:20;pointer-events:none;background:
    radial-gradient(ellipse 62% 46% at 50% 18%, rgba(244,182,97,.10), rgba(244,182,97,0) 68%),
    linear-gradient(180deg, rgba(8,6,4,.22) 0%, rgba(8,6,4,0) 24%, rgba(6,5,4,0) 58%, rgba(4,3,2,.55) 100%)}

  /* O NOME, no PEITO — a virada em relação ao KV. Acima da cabeça ele exigia um vão
     livre que a colagem cheia não tem, e acabava na testa de quem estava atrás. Aqui ele
     desce pra faixa em que a foto já está dissolvendo: embaixo do queixo sempre sobra
     corpo, então sempre há lugar. Sem cápsula dourada — a pílula chamava mais atenção
     que a pessoa, e num line-up quem tem que brilhar é o rosto.
     Camada própria (z 40): dentro do vulto o nome herdaria o z-index do dono e passaria
     por trás de quem está na frente. O nome nunca fica atrás de ninguém. */
  .pal-nomes{position:absolute;inset:0;z-index:40;pointer-events:none}
  .pal-nome{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;
    align-items:center;line-height:1.12;white-space:nowrap;font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;
    text-shadow:0 2px 12px rgba(0,0,0,.95), 0 1px 3px rgba(0,0,0,.9)}
  .pal-nome .n1{color:#fff}
  /* Sobrenome em dourado e um tico menor: os dois nomes na mesma cor viram um bloco e o
     olho não sabe onde acaba um e começa o outro na fileira. */
  .pal-nome .n2{color:var(--acento);font-size:.88em}

  /* O BLOCO DE VENDA fecha a peça, e a ordem dentro dele é fixa: chamada (o gancho),
     título (a promessa), info (a objeção do "quando"), botão (o clique). */
  .pal-baixo{display:flex;flex-direction:column;align-items:center;width:100%;padding:0 56px 52px}
  .slide.palestrantes .eyebrow{font-size:26px;letter-spacing:.24em;color:#cfcabc;
    font-weight:600;margin-bottom:16px}
  /* O ITÁLICO é do modelo, e ele trabalha: inclina a linha pra frente e dá pressa a uma
     frase que, reta, seria só um cartaz. Caixa alta + peso 900 + entrelinha curta = a
     linha vira um bloco sólido, que é o que aguenta os dois tons sem se esfarelar. */
  .pal-titulo{font-family:var(--display);font-weight:900;font-style:italic;
    line-height:1.08;letter-spacing:-.02em;max-width:1000px;text-wrap:balance;color:#fff}
  /* A caixa alta é privilégio da frase curta (o motor decide). Na frase longa ela vira
     paredão: cada linha perde ~35% de largura, o corpo despenca pra caber, e o "título"
     acaba menor que o subtítulo. */
  .pal-titulo.curto{text-transform:uppercase;line-height:1.0}
  .pal-titulo .destaque{color:var(--acento)}
  .pal-sub{margin-top:22px;font-size:29px;font-weight:500;line-height:1.35;color:#c9c5b9;
    max-width:820px;text-wrap:balance}

  /* Os selos de informação. Ícone num quadradinho dourado + texto claro, numa linha só:
     é a última dúvida antes do clique ("quando é isso?"), não um argumento de venda —
     por isso ele é pequeno e discreto, e não um chip gordo como o do `anuncio`. */
  .pal-infos{display:flex;flex-wrap:wrap;gap:18px 40px;justify-content:center;
    align-items:center;margin-top:34px}
  .pal-info{display:flex;align-items:center;gap:14px}
  .pal-info-ico{flex:none;width:52px;height:52px;display:grid;place-items:center;
    color:var(--acento);background:rgba(244,182,97,.14);border-radius:14px}
  .pal-info-ico svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .pal-info-txt{font-size:28px;font-weight:600;color:#e0dcd1;white-space:nowrap}

  /* O botão herda o do `anuncio` — é o mesmo clique, não faz sentido ter dois desenhos.
     Só o tamanho muda: aqui ele divide a peça com cinco rostos e um título gigante, e no
     tamanho do anúncio (que é dono da tela) ele viraria uma tarja. */
  .slide.palestrantes .botao{max-width:820px;font-size:44px;padding:32px 30px;
    border-radius:18px;margin-top:38px}
  .slide.palestrantes .ressalva{margin-top:22px;font-size:26px}

  /* ============================================================
     CARROSSEL "PELA PRIMEIRA VEZ" — estreia de line-up.
     Três registros do MESMO carrossel, e é a moldura chanfrada que os amarra:
     capa preta com a grade de rostos · card do palestrante sobre a foto do evento ·
     fecho na cor chapada. O modelo é `exemplos/referencia/primeira-vez/`.

     O PULO DO GATO É O ESTOURO: o rosto fica DENTRO da janela de cor e o corpo sai
     por BAIXO dela, sobre a foto do evento. Sem isso a peça vira um retrato dentro
     de um retângulo — que é o que qualquer um faz no Canva em dois minutos.
     ============================================================ */
  /* `min-height:0` no corpo é o que prende a peça nos 1350px. Sem ele o corpo é um
     item flex de altura AUTO: ele cresce até caber o conteúdo, as linhas `1fr` da grade
     viram max-content, e as seis fotos saem pela borda de baixo em tamanho original. */
  .slide.estreia .corpo{padding:0;justify-content:flex-start;min-height:0}
  .selo.estreia{padding:44px 56px 16px}
  /* A moldura acompanha o fundo de cada registro: clara no preto, escura no dourado. */
  .est-moldura{position:absolute;inset:0;z-index:5;pointer-events:none;width:100%;height:100%}
  .slide.est-capa .est-moldura,.slide.est-card .est-moldura{color:rgba(255,255,255,.45)}
  .slide.est-fecho .est-moldura{color:rgba(0,0,0,.5)}

  /* ---------- capa: a caixa de cor + a grade de rostos ---------- */
  .est-caixa{margin:0 46px 14px;padding:38px 42px;background:var(--acento);color:var(--tinta);
    border:3px solid var(--tinta)}
  .est-caixa-t{font-family:var(--display);font-weight:800;line-height:1.03;letter-spacing:-.025em}
  .est-caixa-s{margin-top:16px;font-size:33px;font-weight:600;line-height:1.24;max-width:840px}
  /* `minmax(0,1fr)` nas DUAS linhas, e não é preciosismo: linha de altura automática
     com uma imagem `height:100%` dentro não tem em quê se medir — a linha cresce pra
     caber a foto no tamanho original e a grade sai pela borda de baixo do slide. */
  .est-grade{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;padding:0 46px 46px}
  .est-cel{position:relative;overflow:hidden;min-width:0;min-height:0;background:var(--acento);
    display:flex;align-items:flex-end;justify-content:center}
  /* O recorte encosta no CHÃO da célula e sobra cor em volta — é o que faz a grade
     parecer um pôster, e não seis fotos de crachá. */
  .est-cel img.recorte{height:100%;width:auto;max-width:none;object-fit:contain;object-position:bottom}
  /* Sem recorte, a foto crua preenche a célula: o fundo dela vem junto, e a célula
     perde o dourado. É feio de propósito — o remédio é o PNG recortado, não o CSS. */
  .est-cel img.cru{width:100%;height:100%;object-fit:cover;object-position:center 15%}
  /* A etiqueta não está no modelo (que só mostra caras). Está aqui porque o ativo da
     peça são os NOMES — o roteiro os lista um a um, e cara sem nome não vende ninguém. */
  .est-cel-tag{position:absolute;left:0;right:0;bottom:0;z-index:2;background:var(--tinta);
    color:var(--papel);font-size:19px;font-weight:700;text-align:center;padding:9px 6px}

  /* ---------- card: a janela e o estouro ---------- */
  .est-fundo{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;
    filter:blur(4px) saturate(.8) brightness(1.08);transform:scale(1.06)}
  /* O véu abre no MIOLO (a janela precisa do cenário atrás dela pra dizer que o evento
     existe) e fecha embaixo, onde caem o nome e a bio. Fechar o miolo junto apagaria a
     plateia e sobraria a figura recortada boiando no preto. */
  .est-fundoveu{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,
    rgba(0,0,0,.58) 0%, rgba(0,0,0,.28) 18%, rgba(0,0,0,.40) 44%, rgba(0,0,0,.86) 64%, rgba(0,0,0,.97) 78%, #000 100%)}
  .est-palco,.est-quem{position:relative;z-index:2}
  .est-palco{height:760px;margin-top:96px}
  .est-janela{position:absolute;left:90px;right:90px;top:0;height:520px;z-index:1;overflow:hidden;
    background:var(--acento);border:3px solid var(--tinta)}
  /* Sem recorte, a foto CABE pela altura e fica centrada no dourado — não preenche a
     janela. Preenchendo (`cover`), um retrato fechado é ampliado até a janela deitada e
     o corte devolve uma FAIXA da cara: no primeiro teste sobrou do nariz pra cima.
     Aqui ela vira um retrato emoldurado dentro da cor — pior que o estouro, mas
     publicável. O remédio de verdade é o PNG recortado. */
  .est-preso{position:absolute;inset:0;background-size:auto 100%;background-position:center;
    background-repeat:no-repeat}
  /* A figura NÃO mora dentro da janela: ela mora no palco, por cima. Dentro da janela o
     `overflow:hidden` cortaria o corpo na borda de baixo — e é justamente esse corpo
     saindo pra fora que é a peça. A base dissolve porque o recorte automático deixa os
     piores furos na barra da roupa, e porque cada foto corta a pessoa numa altura. */
  .est-figura{position:absolute;left:50%;transform:translateX(-50%);width:auto;z-index:2;
    -webkit-mask-image:linear-gradient(180deg,#000 86%,transparent 100%);
            mask-image:linear-gradient(180deg,#000 86%,transparent 100%);
    filter:contrast(1.05) drop-shadow(0 16px 26px rgba(0,0,0,.5))}
  /* O carimbo diz "pela primeira vez" em círculo — assim a frase não precisa ser
     repetida em texto corrido nos seis slides. Ele monta na quina da janela: metade
     na cor, metade na foto, que é o que o prende às duas camadas. */
  .est-carimbo{position:absolute;left:22px;top:300px;width:212px;height:212px;z-index:3;
    filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
  .est-quem{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:22px 68px 50px}
  .est-nome{font-family:var(--display);font-weight:900;line-height:1.04;letter-spacing:-.025em;
    font-size:62px;color:var(--papel);text-wrap:balance}
  .est-bios{margin-top:20px;max-width:900px}
  p.est-bio{line-height:1.42;font-weight:500;color:#e2dfd6}
  p.est-bio + p.est-bio{margin-top:16px}

  /* ---------- fecho: a cor chapada ----------
     O logo é DOURADO: no dourado chapado ele sumiria. Entra no chip preto — o mesmo
     lockup padrão da casa, que aqui faz o papel do logo preto do modelo sobre a cor. */
  .slide.estreia.est-fecho{background:var(--acento);color:var(--tinta)}
  .est-fecho-txt{padding:22px 56px 0}
  .est-fecho-t{font-family:var(--display);font-weight:900;line-height:1.04;letter-spacing:-.035em}
  .est-fecho-s{margin-top:32px;font-size:37px;font-weight:600;line-height:1.3;max-width:880px;
    color:rgba(0,0,0,.72)}
  .est-fecho-cta{margin-top:28px;font-size:40px;font-weight:800;line-height:1.26;max-width:880px}
  .slide.est-fecho .destaque{color:var(--papel)}
  .est-acoes{position:absolute;left:56px;right:56px;bottom:58px;z-index:3;display:flex;
    align-items:center;gap:34px;padding:26px 34px;border:3px solid var(--tinta);border-radius:20px}
  .est-acoes svg{width:56px;height:56px;fill:none;stroke:var(--tinta);stroke-width:1.5;
    stroke-linecap:round;stroke-linejoin:round}
  .est-acoes svg.fim{margin-left:auto}

  /* ============================================================
     CARROSSEL NATIVO — thread e legenda.
     Aqui a identidade da casa NÃO entra: sem logo, sem dourado, sem Montserrat.
     A peça imita conteúdo orgânico; carimbar marca mataria o efeito.
     ============================================================ */
  .slide.nativo{font-family:var(--nativo)}
  .slide.nativo.claro{background:#fff;color:#0f1419}
  .slide.nativo.escuro{background:#000;color:#e7e9ea}
  .slide.nativo .corpo{padding:0;justify-content:flex-start}

  /* ---------- thread do X ---------- */
  .slide.thread{padding:64px}
  /* Slide COM imagem: o card encosta no topo, a imagem preenche o resto.
     Slide SÓ TEXTO: perfil + texto flutuam juntos no meio do preto. É o remate. */
  .slide.thread .corpo{flex:0 0 auto}   /* texto não estica: a imagem cola nele */
  .slide.thread.sem-img{justify-content:center}
  .perfil{display:flex;align-items:center;gap:24px;margin-bottom:48px}
  .perfil .avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;flex:none}
  /* Avatar que é LOGO (wordmark largo): recortar no quadrado decapita o lockup e
     sobra "SUM". Encaixa inteiro num disco preto, como a foto de perfil real. */
  .perfil .avatar.contain{object-fit:contain;background:#000;padding:14px}
  .perfil .avatar.vazio{display:grid;place-items:center;background:#cfd9de;color:#5b7083;
    font-weight:700;font-size:44px}
  .perfil .quem{display:flex;flex-direction:column;gap:2px;min-width:0}
  .perfil .nome-perfil{display:flex;align-items:center;gap:10px;font-size:42px;font-weight:700}
  .perfil .verificado{width:40px;height:40px;flex:none}
  .perfil .handle{font-size:38px;color:#71767b}

  /* Peso NORMAL: é assim que o X renderiza um tweet. Negrito entrega que é arte. */
  .thread-txt{font-weight:400;line-height:1.34;letter-spacing:-.003em}
  .thread-txt .tp + .tp{margin-top:1.1em}
  /* marca-texto: na thread o realce é caixa vermelha, não o dourado da casa */
  .slide.thread .destaque{background:var(--marcador);color:#fff;padding:2px 10px;border-radius:6px;
    -webkit-box-decoration-break:clone;box-decoration-break:clone}

  .thread-capa{text-align:center;margin-top:40px}
  .thread-titulo{font-size:76px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em}
  .thread-gancho{margin-top:56px;font-size:64px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  /* A imagem do slide: uma (o normal) ou duas lado a lado, como o X mostra. */
  /* A imagem cresce pra ocupar tudo o que sobra abaixo do texto — é o que dá o ar
     de print de celular. `min-height:0` deixa ela encolher se o texto for longo. */
  .thread-imgs{display:flex;gap:8px;margin-top:52px;flex:1;min-height:0;
    border-radius:32px;overflow:hidden}
  .thread-imgs img{display:block;width:100%;height:100%;object-fit:cover;min-width:0}
  .thread-imgs.duas img{width:50%}
  /* A faixa recorta a foto igual o 4:5 dos estáticos: numa foto de corpo inteiro o
     corte central DECAPITA. Mesmo `foco` dos outros tipos, agora aqui também. */
  .thread-imgs.topo img{object-position:center top}
  .thread-imgs.baixo img{object-position:center bottom}
  .thread-imgs.esquerda img{object-position:left center}
  .thread-imgs.direita img{object-position:right center}

  /* ---------- foto com caixa de legenda ---------- */
  .slide.legenda{padding:0}
  .slide.legenda .corpo{flex:1;padding:0;justify-content:center}
  .paineis{display:flex;width:100%;height:100%;gap:4px;background:#000}
  .painel{flex:1;min-width:0;position:relative;background-size:cover;background-position:center;
    background-color:#111;display:flex;align-items:flex-end;justify-content:center;padding-bottom:22%}
  .painel .caixa{background:#fff;color:#000;font-weight:700;font-size:44px;line-height:1.22;
    text-align:center;padding:24px 30px;max-width:86%}
  .paineis .painel:only-child .caixa{font-size:56px;max-width:70%}

  /* fecho do carrossel: fundo branco, só a pergunta e o CTA de comentário */
  .legenda-fecho{font-weight:700;line-height:1.3;letter-spacing:-.02em;padding:90px}
  .legenda-fecho .lf + .lf{margin-top:1.2em}

  /* ============================================================
     VIRADA DE LOTE — a peça de PREÇO.
     Ela não vende o evento: vende o RELÓGIO. Quem já quer ir sabe o que é o
     Summit; o que falta é a data em que fica mais caro. Por isso a peça é uma
     TABELA — dois preços, o velho riscado e o novo — e não uma frase de efeito.

     A moldura arredondada existe pra isolar a tabela da foto: número lido em
     cima de foto vira ruído, e aqui o número É a informação. O card fecha o
     recinto; a foto atrás só lembra que o evento existe.
     ============================================================ */
  .slide.lote .corpo{padding:0}
  .lote-card{position:absolute;inset:60px;z-index:2;overflow:hidden;
    border:2px solid rgba(244,182,97,.55);border-radius:46px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:44px 52px 40px}
  /* O brilho mora DENTRO do card, e de propósito: é ele que separa o recinto do
     resto da arte. Sem isso o card seria só um retângulo riscado sobre a foto. */
  .lote-card::before{content:"";position:absolute;inset:0;z-index:0;background:
    radial-gradient(105% 58% at 50% 20%, rgba(244,182,97,.32), rgba(244,182,97,.06) 58%, rgba(0,0,0,.30) 100%)}
  .lote-card > *{position:relative;z-index:1}

  /* A SIRENE é o gatilho: ela diz "alarme" antes de qualquer palavra ser lida.
     Some com "alerta": false quando a peça for de lote NOVO (aviso, não urgência). */
  .lote-alerta{width:auto;flex:none;filter:drop-shadow(0 14px 30px rgba(0,0,0,.55))}

  .lote-titulo{font-family:var(--display);font-weight:900;text-transform:uppercase;
    line-height:.94;letter-spacing:-.02em;text-shadow:0 6px 26px rgba(0,0,0,.6)}
  /* A DATA da virada é o argumento inteiro da peça: é ela que põe prazo no leitor.
     Fica logo abaixo do título, em peso médio — grande demais, brigaria com ele. */
  .lote-aviso{margin-top:20px;font-weight:600;letter-spacing:.01em;
    text-shadow:0 4px 16px rgba(0,0,0,.6)}
  /* A linha que ATIRA o leitor pra tabela ("garanta antes da mudança de valor").
     Ela é ponte, não título: peso médio, cor de apoio — se competir com o VIRADA
     DE LOTE, sobram dois títulos e nenhum. */
